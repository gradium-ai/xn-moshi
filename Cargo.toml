[package]
name = "xn-moshi"
version = "0.2.6"
edition = "2024"
description = "Moshi speech-to-speech, ASR and Mimi models running on the xn inference framework."
repository = "https://github.com/gradium-ai/xn-moshi"
keywords = ["moshi", "speech", "deep-learning", "machine-learning"]
categories = ["science"]
license = "MIT/Apache-2.0"

[dependencies]
kaudio = { version = "0.2.1", optional = true }
rand = { version = "0.9.0", default-features = false, features = ["thread_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
xn = "0.2.5"

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = { version = "2.7.1", features = ["num-traits"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
sentencepiece = "0.13.1"
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[features]
default = []
cuda = ["xn/cuda"]
accelerate = ["xn/accelerate"]
audio = ["dep:kaudio"]
metal = ["xn/metal"]
vulkan = ["xn/vulkan"]
webgpu = ["xn/webgpu"]

[[example]]
name = "moshi"
required-features = ["audio"]

[profile.release]
debug = true

[profile.release-no-debug]
inherits = "release"
debug = false
